name: Deploy API
on:
  push:
    branches: [main]
    paths:
      - api/**
      - config/**
      - snapshots/sample/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy-api.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: deploy-api
  cancel-in-progress: false
jobs:
  deploy:
    name: Build image, push to GHCR, update Container App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/firelens-api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # The Azure steps stay off until `infra/provision.sh github` has set AZURE_API_APP.
      - if: vars.AZURE_API_APP != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - if: vars.AZURE_API_APP != ''
        run: >
          az containerapp update -g "${{ vars.AZURE_RG }}" -n "${{ vars.AZURE_API_APP }}"
          --image "${{ steps.image.outputs.name }}:${{ github.sha }}" -o none
