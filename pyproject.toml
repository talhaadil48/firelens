[project]
name = "firelens"
version = "0.1.0"
description = "Evidence-linked exploration of NASA microgravity combustion research"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "pyyaml>=6,<7",
]

[dependency-groups]
api = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "duckdb>=1.1,<2", "lancedb>=0.17,<1", "openai>=1.60,<3",
  "azure-identity>=1.19,<2", "azure-storage-blob>=12.24,<13",
]
harvest = [
  "pandas>=2.2,<3", "pandera[pandas]>=0.24,<1", "pyarrow>=19,<24",
  "duckdb>=1.1,<2", "lancedb>=0.17,<1", "openai>=1.60,<3",
  "pymupdf>=1.25,<2", "python-docx>=1.1,<2",
  "azure-identity>=1.19,<2", "azure-storage-blob>=12.24,<13",
]
dev = ["ruff>=0.11,<1", "pytest>=8.3,<10", "pytest-cov>=6,<8"]

[tool.uv]
default-groups = ["api", "harvest", "dev"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
