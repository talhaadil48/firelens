schema_version: 1
accession: PSI-10
table_id: normal
source_file: PSI-10_Experimental table_Flame Design_Normal Flame.csv
encoding: utf-8-sig
header_row: 1
skip_rows: []
id_column: "Test"
id_prefix: "normal-"
record_kind: individual_test
default_fuel_phase: gas
default_oxygen_basis: mole
default_gravity: microgravity

columns:
  fuel:
    source_column: "Fuel"
  o2_fraction:
    source_column: "XO2 (init)"
    unit: mole_fraction
    multiplier: 1.0
  pressure_kpa:
    source_column: "pinit (atm)"
    unit: atm
    multiplier: 101.325

metrics:
  mfuel:
    source_column: "mfuel (mg/s)"
    unit: mg/s
  mN2:
    source_column: "mN2 (mg/s)"
    unit: mg/s
  mtot:
    source_column: "mtot (mg/s)"
    unit: mg/s
  pfinal_atm:
    source_column: "pfinal (atm)"
    unit: atm
  adiabatic_flame_temp_k:
    source_column: "Tad (K)"
    unit: K

notes:
  - "ACME Flame Design Normal Flame table; pressure converted atm -> kPa."
