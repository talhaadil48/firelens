schema_version: 1
accession: PSI-25
source_file: PSI-25_Experimental table_BASS-II.csv
encoding: utf-8-sig
header_row: 1
skip_rows: []
id_column: "Test #"
study_level_only: false
default_fuel_phase: solid
default_oxygen_basis: volume
default_gravity: microgravity
