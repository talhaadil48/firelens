    unit: "%"
  initial_co2_pct:
    source_column: "Initial CO2 % by vol"
    unit: "%"
  final_co2_pct:
    source_column: "Final CO2 % by vol"
    unit: "%"
  initial_co_ppm:
    source_column: "Initial CO (ppm)"
    unit: ppm
  final_co_ppm:
    source_column: "Final CO (ppm)"
    unit: ppm

notes:
  - "BASS-II table; initial O2 % by vol converted to 0-1 fraction."
